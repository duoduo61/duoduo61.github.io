                "text": "我会和命运战斗，并且战胜给你看！",
                "author": "「 剑崎一真 」"
            },
            {
                "text": "梦想家是把他的想象变成现实的人。他从不感到疲倦，并且继续鼓舞人心，坚持自己的梦想，并把它变成现实。",
                "author": "「 尼希亚南达 」"
            },
            {
                "text": "故事开始便不承认普通",
                "author": "「 君子剑伤 」"
            },
            {
                "text": "春色满园关不住，一枝红杏出墙来。",
                "author": "「 叶绍翁 」"
            },
            {
                "text": "绝望的世界没有丝毫存在的价值。",
                "author": "「 带土 」"
            },
            {
                "text": "如果我们总是等着自己做好准备，那可能这一生都在等待中度过了。",
                "author": "「 佚名 」"
            },
            {
                "text": "群体只会干两件事，锦上添花或者落井下石。",
                "author": "「 古斯塔夫·勒庞 」"
            },
            {
                "text": "一壶酒，一竿身，快活如侬有几人。",
                "author": "「 李煜 」"
            },
            {
                "text": "当一个胖纸没有什么不好，最起码可以温暖其他的人。",
                "author": "「 龙猫 」"
            },
            {
                "text": "你知道雪为什么是白色的吗？因为它忘记了自己曾经的颜色。",
                "author": "「 C.C. 」"
            },
            {
                "text": "生命本没有意义，你要能给它什么意义，它就有什么意义。",
                "author": "「 胡适 」"
            },
            {
                "text": "千里之行，始于足下。",
                "author": "「 道德经 」"
            },
            {
                "text": "前世若不相欠，今生怎会相见。",
                "author": "「 佚名 」"
            },
            {
                "text": "今天没有月亮，月亮在我怀里。",
                "author": "「 苏晏. 」"
            },
            {
                "text": "找导师和找对象一样，都是迷惑行为。",
                "author": "「 帆仔 」"
            },
            {
                "text": "看惯了长夜，仍然要向往天明。",
                "author": "「 保底全歪真君 」"
            },
            {
                "text": "人总是健忘的，所以在行走一段人生旅途后，总要不自觉地停下来，整理一下前段时间的得与失，得大于失证明这段时间没有浪费，欣喜若狂的准备下一段旅途。",
                "author": "「 唐砖 」"
            },
            {
                "text": "骐骥一跃，不能十步；驽马十驾，功在不舍。锲而舍之，朽木不折；锲而不舍，金石可镂。",
                "author": "「 荀子 」"
            },
            {
                "text": "哪一场仗不难打，越难打，就更要打。",
                "author": "「 余从戎 」"
            },
            {
                "text": "诚如是，则霸业可成，汉室可兴矣！",
                "author": "「 陈寿 」"
            },
            {
                "text": "胜败乃兵家常事，既然能进退自如，便不算完败。",
                "author": "「 令 」"
            },
            {
                "text": "人永远不知道，谁哪次不经意的跟你说了再见之后，就真的不会再见了。",
                "author": "「 千与千寻 」"
            },
            {
                "text": "有人戳你脊梁，有人爱你荒唐。",
                "author": "「 与又 」"
            },
            {
                "text": "我们找到了一个晶莹绚丽，却又稍纵即逝的东西。我们称它为永恒。",
                "author": "「 Kyanite 」"
            },
            {
                "text": "可惜生活不是电影，我也少一点运气。",
                "author": "「 兔子君 」"
            },
            {
                "text": "异地恋是，尝过欣喜若狂，也知道失魂落魄。",
                "author": "「 原创 」"
            },
            {
                "text": "个人一小步，人类一大步；无论大步还是小步，总是左右世界的步伐。",
                "author": "「 The New Order:Last Days of Europe 」"
            },
            {
                "text": "落日拉开黑夜的帷幕，繁星点燃黎明的火光。",
                "author": "「 神奇のDzoer 」"
            },
            {
                "text": "不以物喜，不以己悲。",
                "author": "「 岳阳楼记 」"
            },
            {
                "text": "归期未如佳期至，巴山夜雨留荒词。",
                "author": "「 剑网3 」"
            },
            {
                "text": "在我单枪匹马的背后，是爱我的千军万马。",
                "author": "「 黛西 」"
            },
            {
                "text": "たとえどんな现実を突きつられようと それでもと・言い続ける 自分を见失うな。",
                "author": "「 机动战士高达独角兽 」"
            },
            {
                "text": "我在你看不见的地方，看了你无数次.",
                "author": "「 佚名 」"
            },
            {
                "text": "宁可御敌于战场，不可怠敌于萧墙。",
                "author": "「 阿克图尔斯·蒙斯克 」"
            },
            {
                "text": "愿我等之誓言，超越姓名与身份而永存。",
                "author": "「 风姿物语 」"
            },
            {
                "text": "跑得快不一定赢，不跌跟头才是成功",
                "author": "「 8848太监手机 」"
            },
            {
                "text": "料得年年断肠处，明月夜，短松冈。",
                "author": "「 苏轼 」"
            },
            {
                "text": "失望了吗？没错，世上或许有些东西别打开比较好，真正把心打开的人多么麻烦啊！",
                "author": "「 绝望先生 」"
            },
            {
                "text": "控兄是我的个性的同时，也是勋章！",
                "author": "「 就算是哥只要有爱就没问题对吧 」"
            },
            {
                "text": "飞花落雪皆不见，眸中唯有一人现。",
                "author": "「 墨隐 」"
            },
            {
                "text": "由我这个一直吃着心叶写下的故事的『文学少女』说的这句话，是不会错的啊。",
                "author": "「 天野远子 」"
            },
            {
                "text": "时间并不存在，存在的只有此刻。",
                "author": "「 魔女猎人 」"
            },
            {
                "text": "天涯咫尺或不及，江湖方寸在此间。",
                "author": "「 解牵年 」"
            },
            {
                "text": "醒来的时候很困，要睡了的时候很精神。",
                "author": "「 混沌喵 」"
            },
            {
                "text": "不知横跨几度银河，才终于在尽头与你相遇",
                "author": "「 前前前世 」"
            },
            {
                "text": "在每一个历史断面上，你都能找到一大堆丢失的机遇。",
                "author": "「 刘慈欣 」"
            },
            {
                "text": "生命中曾拥有过的灿烂，原来终究，都需要用孤独去偿还。",
                "author": "「 加西亚·马尔克斯 」"
            },
            {
                "text": "这个世界上，活得轻松的只有两种人：傻子和疯子。每个正常人都有压力，或大，或小。但是请不要忘记，你不是一个人。",
                "author": "「 随笔 」"
            },
            {
                "text": "工欲善其事，必先利其器。",
                "author": "「 论语 」"
            },
            {
                "text": "闻道者，朝生夕死，足尔；寻道者，忘生之死，憾尔。",
                "author": "「 耳根 」"
            },
            {
                "text": "亲近你的朋友，但更要亲近你的敌人。",
                "author": "「 教父2 」"
            },
            {
                "text": "一个人只有在痛苦之中才能明白什么是真正属于自己的……只有在破碎之中，人才能认识自己。",
                "author": "「 贝内迪克特·韦尔斯 」"
            },
            {
                "text": "燕子来时新社，梨花落后清明。",
                "author": "「 晏殊 」"
            },
            {
                "text": "人生不如意十有八九！",
                "author": "「 龙与虎 」"
            },
            {
                "text": "你逆光而来，配得上世间所有的美好。",
                "author": "「 网络 」"
            },
            {
                "text": "我寻找大海的尽头，却忽略蜿蜒的河流，当我逆水行舟，你在我左右，推着我走。",
                "author": "「 楼南蔚 」"
            },
            {
                "text": "喂，前面可是地狱啊！おい、この先は地狱だぜ！",
                "author": "「 Fate/stay night 」"
            },
            {
                "text": "我们都在阴沟里，但仍然有人仰望星空。",
                "author": "「 王尔德 」"
            },
            {
                "text": "凡事都有一个与一望而知不同的真相",
                "author": "「 约翰·勒卡雷 」"
            },
            {
                "text": "如果这样做能为比奇堡带来荣耀的话，那我愿意挺身而出！",
                "author": "「 派大星 」"
            },
            {
                "text": "Everyting Goes On.",
                "author": "「 星之守护者 」"
            },
            {
                "text": "黄油嘴边讲，纯爱心中藏。废萌永不倒，甜作放光芒。",
                "author": "「 galgame 」"
            },
            {
                "text": "广厦千间，夜眠仅需六尺；家财万贯，日食不过三餐。",
                "author": "「 增广贤文 」"
            },
            {
                "text": "关于自己的生活，我和你都不是读者，而是作者。至少结局，还是能自己说了算的。",
                "author": "「 银魂 」"
            },
            {
                "text": "从来就没有什么失败的人，只有半途而废的人。",
                "author": "「 罗永浩 」"
            },
            {
                "text": "我会在那片黑色的海洋上画一扇扇窗，在血红色的城里推开一扇扇门，我会让所有习惯黑暗的眼睛，看见光。",
                "author": "「 我会修空调 」"
            },
            {
                "text": "羡青山有思，白鹤忘机。",
                "author": "「 汤恢 」"
            },
            {
                "text": "锄禾日当午，贺题好辛苦，对着博客园，一贺一上午，贺了一上午，还要贺下午，不贺没前途，只能去跑路。",
                "author": "「 贺指导 」"
            },
            {
                "text": "有的人，终生都在怀念那个夏天。最好的我们，始终会留在那年八月。前程似锦是一句离别时说的话 ，祝你前程似锦也祝我前途无量。这首歌的评论刷的这么快，就让这条评论，带着我对你祝福沉下去吧。",
                "author": "「 网易云热评 」"
            },
            {
                "text": "See I was blind to the sun by my thunder.",
                "author": "「 Vicetone 」"
            },
            {
                "text": "反正不要钱，多少信一点",
                "author": "「 异常生物见闻录 」"
            },
            {
                "text": "欲寄彩笺兼尺素，山长水阔知何处。",
                "author": "「 晏殊 」"
            },
            {
                "text": "可以看起来不伟大却要善良，要尝过时间给过的挫败才能够变得坦然。",
                "author": "「 李荣浩 」"
            },
            {
                "text": "失落至极致，是虚无。",
                "author": "「 GoodChing 」"
            },
            {
                "text": "仅仅是沉溺于过去，那么，一个人将没有未来。",
                "author": "「 pokon548 」"
            },
            {
                "text": "既然不能让对手变弱，那就让自己变强！",
                "author": "「 原创 」"
            },
            {
                "text": "上元佳节，神武大街，惊鸿一瞥，百世沦陷。",
                "author": "「 墨香铜臭 」"
            },
            {
                "text": "爱一个人，就让自己变得明亮，给她带去光明。",
                "author": "「 柳柳 」"
            },
            {
                "text": "保持热爱，奔赴山海。",
                "author": "「 佚名 」"
            },
            {
                "text": "不管是怎样的回忆，都是我们活过的人生。",
                "author": "「 angel beats 」"
            },
            {
                "text": "有的时候我真觉得全世界都像海上撞沉了船，最要紧的还是救出自己",
                "author": "「 易卜生 」"
            },
            {
                "text": "月亮不知道她的恬静皎洁，甚至不知道自己是月亮。",
                "author": "「 博尔赫斯 」"
            },
            {
                "text": "重要的人，不能忘记的人，不想忘记的人。 你，是谁？",
                "author": "「 你的名字 」"
            },
            {
                "text": "浮云一别后，流水十年间。",
                "author": "「 韦应物 」"
            },
            {
                "text": "若我们并肩作战，你要照顾好自己哦？",
                "author": "「 驱魔师美娅 」"
            },
            {
                "text": "我会捧着鲜花去见你，在花谢的时节。",
                "author": "「 祁连山 」"
            },
            {
                "text": "井底之蛙不曾见过大海，但见过湛蓝的天空。",
                "author": "「 超和平Busters 」"
            },
            {
                "text": "地球只有一个，而欧派有两个。",
                "author": "「 网络 」"
            },
            {
                "text": "人一生会遇到约2920万人，两个人相爱的概率是0.000049。所以你不爱我，我不怪你。",
                "author": "「 秒速五厘米 」"
            },
            {
                "text": "那双紧握不放的手……抓住的是希望……亦或是绝望……",
                "author": "「 sseeyou 」"
            },
            {
                "text": "如果再也见不到你，祝你早安、午安、晚安。",
                "author": "「 楚门的世界 」"
            },
            {
                "text": "世间好物不坚牢，彩云易散琉璃脆。",
                "author": "「 杨绛 」"
            },
            {
                "text": "前半生无你，余生请指教。",
                "author": "「 网络 」"
            },
            {
                "text": "命运如同一团乱麻，我们抽丝剥茧百般追寻，最终终于解开了这个线团，却发现所有人手里都拿错了线头…",
                "author": "「 希灵帝国 」"
            },
            {
                "text": "即使被关在果壳之中，我仍自以为是无限宇宙之王。",
                "author": "「 哈姆雷特 」"
            },
            {
                "text": "兰有秀兮菊有芳，怀佳人兮不能忘。",
                "author": "「 刘彻 」"
            },
            {
                "text": "唯因虚梦，尤需真活。彼梦会醒，此梦亦终有醒来之时。人生在世，要活得回首往事之际能无愧于说：此生确曾活出个名堂来。",
                "author": "「 黄粱梦 」"
            },
            {
                "text": "虽然说有那么点点喜欢她，她也是一直在暗示，但我真的只想保持现在这样。",
                "author": "「 Mr.Chen 」"
            },
            {
                "text": "这一路走来我都做得很好，我是能干的人，今天也是，从今往后也是，无论有多挫折。",
                "author": "「 鬼灭之刃 」"
            },
            {
                "text": "若知是梦何须醒，不比真如一相会。",
                "author": "「 神里绫华 」"
            },
            {
                "text": "我会死在这里，我的每一寸肌肤都会腐烂，除了…一寸，这一寸，它是那么的小，那么的脆弱，却是这世上唯一值得拥有的东西，我们决不能失去或者放弃它，我们决不能让别人把它夺走。",
                "author": "「 盖伊 」"
            },
            {
                "text": "科研成就的上限在于你的想象力。",
                "author": "「 帆仔 」"
            },
            {
                "text": "每个人都是有梦想的！当然，你要先做个梦，不然就是瞎想。",
                "author": "「 Shawn 」"
            },
            {
                "text": "对友谊来说，笑声确实是个不错的开端，同时也是最好的结局。",
                "author": "「 道林·格雷的画像 」"
            },
            {
                "text": "如今这里荒草丛生没有了鲜花，好在曾今拥有你们的春秋和冬夏。",
                "author": "「 朴树  」"
            },
            {
                "text": "漠漠水田飞白鹭，阴阴夏木啭黄鹂。",
                "author": "「 王维 」"
            },
            {
                "text": "山远天高烟水寒，相思枫叶丹。",
                "author": "「 李煜 」"
            },
            {
                "text": "想象力是武器，没有想象力的人会先死。",
                "author": "「 哥布林杀手 」"
            },
            {
                "text": "我不承认需要有人牺牲的魔法，而且人与人的思念，可以超越魔法。",
                "author": "「 芳乃樱 」"
            },
            {
                "text": "在下雪时。第一次相会时。雪白的夜与漆黑的伞。只要有你在身边。只要你露出微笑。就是幸福。",
                "author": "「 空之境界 」"
            },
            {
                "text": "当君怀归日，是妾断肠时。",
                "author": "「 李白 」"
            },
            {
                "text": "你那么憎恨他们，跟他们斗了这么久，琢磨了他们这么久，最终却变得和他们一样；人世间没有任何理想值得以这样的沉沦作为代价。",
                "author": "「 加西亚·马尔克斯 」"
            },
            {
                "text": "春天适合努力和拥抱。",
                "author": "「 网络 」"
            },
            {
                "text": "为什么要把眼影涂得那么红——可能是原来的样子太亲切了吧。",
                "author": "「 匿名 」"
            },
            {
                "text": "一年、两年、三年…十年、百年、千年…即使用永恒的时间来等待，我也想再见你一面。",
                "author": "「 幻想三国志 」"
            },
            {
                "text": "绝望自有绝望的力量，正如希望自有希望的无能.",
                "author": "「 XiaoMaFenJu 」"
            },
            {
                "text": "是的，即使你拥有人人羡慕的容貌、博览群书的才学、挥霍不尽的财富，也不能证明你的强大；因为心的强大，才是真正的强大。",
                "author": "「 当年明月 」"
            },
            {
                "text": "我笑了，开怀的笑了，真的",
                "author": "「 小C 」"
            },
            {
                "text": "晨意微寒秋渐深，侧伴无事俏佳人。",
                "author": "「 Kazusa 」"
            },
            {
                "text": "不相信自己的人，连努力的价值都没有。",
                "author": "「 火影忍者 」"
            },
            {
                "text": "星空彼岸的光芒，幻想触及的地方，我到了淤泥深处，捡到了一颗星星。",
                "author": "「 priest 」"
            },
            {
                "text": "如果你认识从前的我，也许会原谅现在的我。",
                "author": "「 张爱玲 」"

        // 时间更新函数
        function updateTime() {
            const now = new Date();
            const year = now.getFullYear();
            const month = String(now.getMonth() + 1).padStart(2, '0');
            const day = String(now.getDate()).padStart(2, '0');
            const week = ['星期日', '星期一', '星期二', '星期三', '星期四', '星期五', '星期六'][now.getDay()];
            const hours = String(now.getHours()).padStart(2, '0');
            const minutes = String(now.getMinutes()).padStart(2, '0');
            const seconds = String(now.getSeconds()).padStart(2, '0');

            document.getElementById('date').textContent = `${year} 年 ${month} 月 ${day} 日 ${week}`;
            document.getElementById('time').textContent = `${hours}:${minutes}:${seconds}`;
        }

        // 随机显示句子函数
        function renderRandomQuote() {
            const randomIndex = Math.floor(Math.random() * quoteList.length);
            const currentQuote = quoteList[randomIndex];
            document.getElementById('quote-text').textContent = currentQuote.text;
            document.getElementById('quote-author').textContent = `- ${currentQuote.author}`;
        }

        // 初始化时间并每秒更新
        updateTime();
        setInterval(updateTime, 1000);

        // 页面加载时渲染随机句子
        renderRandomQuote();

        // 跳转链接函数
        function openLink(url) {
            window.open(url, '_blank');
        }
