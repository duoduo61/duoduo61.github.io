<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>博客</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }

        /* 背景遮罩 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }

        .container {
            width: 100%;
            max-width: 820px;
        }

        /* 页面大标题 */
        .blog-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }

        /* 内容卡片通用样式 */
        .blog-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 35px 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }

        /* 文章项 */
        .post-item {
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }

        .post-item:last-child {
            padding-bottom: 0;
            margin-bottom: 0;
            border-bottom: none;
        }

        .post-title {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }

        .post-title a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        .post-title a:hover {
            color: #63b3ed;
        }

        .post-title i {
            font-size: 1rem;
            opacity: 0.8;
        }

        .post-meta {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .post-content {
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }

        /* 分页控件 */
        .pagination {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }

        .page-btn {
            padding: 8px 16px;
            background: rgba(99, 179, 237, 0.2);
            border: 1px solid rgba(99, 179, 237, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .page-btn:hover:not(:disabled) {
            background: rgba(99, 179, 237, 0.3);
            border-color: rgba(99, 179, 237, 0.5);
            transform: translateY(-1px);
        }

        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .page-btn.active {
            background: rgba(99, 179, 237, 0.4);
            border-color: rgba(99, 179, 237, 0.6);
        }

        /* 底部版权 */
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
        }

        footer a {
            color: inherit;
            text-decoration: none;
        }

        footer a:hover {
            text-decoration: underline;
        }

        /* 响应式适配 */
        @media (max-width: 600px) {
            .blog-card {
                padding: 25px 20px;
            }
            
            .blog-title {
                font-size: 1.5rem;
            }

            .post-title {
                font-size: 1.1rem;
            }

            .post-content {
                font-size: 0.9rem;
            }

            .page-btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1 class="blog-title">
            <i class="fa-solid fa-blog"></i> 博客
        </h1>

        <div class="blog-card">
            <!-- 文章列表容器 -->
            <div id="postList"></div>
        </div>

        <!-- 分页容器 -->
        <div class="pagination" id="pagination"></div>
    </div>

    <footer>
        Copyright © 2025 - 2026 @多多 
        <a href="https://icp.gov.moe/?keyword=20260227" target="_blank">萌ICP备20260227号</a>
    </footer>

    <script>
        // ==================== 自定义内容区域 ====================
        const blogPosts = [
            {
                title: "先水一篇再说~",
                date: "06-27",
                url: "https://duoduo666.de5.net/blog/2026-01",
                content: "虽然不知道有什么用，但还是把这个博客搭起来了。但我得先说清楚：我真的不怎么会写文章。 ..."
            },
            {
                title: "我用AI做了一个Python五子棋！",
                date: "07-15",
                url: "https://duoduo666.de5.net/blog/2026-02",
                content: "终于放暑假了~重要声明：此程序源码逻辑为AI生成，完全免费开源 游戏为Python代码..."
            }
        ];
        // ========================================================

        const PAGE_SIZE = 10; // 每页显示10条
        let currentPage = 1;

        // 渲染当前页文章列表
        function renderPosts() {
            const postList = document.getElementById('postList');
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const currentPosts = blogPosts.slice(start, end);

            let html = '';
            currentPosts.forEach(post => {
                html += `
                    <div class="post-item">
                        <h3 class="post-title">
                            <a href="${post.url}" target="_blank" rel="noopener noreferrer">
                                <i class="fa-solid fa-arrow-up-right-from-square"></i> ${post.title}
                            </a>
                        </h3>
                        <div class="post-meta">
                            <i class="fa-solid fa-clock"></i> ${post.date}
                        </div>
                        <div class="post-content">${post.content}</div>
                    </div>
                `;
            });

            postList.innerHTML = html;
        }

        // 渲染分页控件
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(blogPosts.length / PAGE_SIZE);

            // 只有1页时不显示分页
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }

            let html = '';
            // 上一页按钮
            html += `
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
                    <i class="fa-solid fa-chevron-left"></i> 上一页
                </button>
            `;

            // 页码按钮
            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }

            // 下一页按钮
            html += `
                <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
                    下一页 <i class="fa-solid fa-chevron-right"></i>
                </button>
            `;

            pagination.innerHTML = html;
        }

        // 切换页面
        function changePage(page) {
            const totalPages = Math.ceil(blogPosts.length / PAGE_SIZE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderPosts();
            renderPagination();
            // 切换页面后滚动到顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 初始化
        window.onload = function() {
            renderPosts();
            renderPagination();
        }
    </script>
</body>
</html>
