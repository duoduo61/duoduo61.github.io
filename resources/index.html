<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>资源</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: url('https://images.unsplash.com/photo-1506744038136-46273834b3fb?ixlib=rb-4.0.3&auto=format&fit=crop&w=1920&q=80') no-repeat center center fixed;
            background-size: cover;
            color: #fff;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            padding: 40px 20px;
            position: relative;
        }
        /* 背景遮罩 */
        body::before {
            content: '';
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.35);
            z-index: -1;
        }
        .container {
            width: 100%;
            max-width: 820px;
        }
        /* 页面大标题 */
        .res-title {
            text-align: center;
            font-size: 2rem;
            font-weight: 600;
            margin-bottom: 30px;
            text-shadow: 0 2px 10px rgba(0, 0, 0, 0.3);
        }
        /* 内容卡片通用样式 */
        .res-card {
            background: rgba(255, 255, 255, 0.1);
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            border-radius: 12px;
            padding: 35px 40px;
            border: 1px solid rgba(255, 255, 255, 0.15);
        }
        /* 资源项 */
        .res-item {
            padding-bottom: 24px;
            margin-bottom: 24px;
            border-bottom: 1px solid rgba(255, 255, 255, 0.12);
        }
        .res-item:last-child {
            padding-bottom: 0;
            margin-bottom: 0;
            border-bottom: none;
        }
        .res-name {
            font-size: 1.25rem;
            font-weight: 600;
            margin-bottom: 10px;
        }
        .res-name a {
            display: flex;
            align-items: center;
            gap: 10px;
            color: inherit;
            text-decoration: none;
            transition: color 0.3s ease;
        }
        .res-name a:hover {
            color: #63b3ed;
        }
        .res-name i {
            font-size: 1rem;
            opacity: 0.8;
        }
        /* 自定义图片图标样式 */
        .custom-icon-img {
            width: 1.1rem;
            height: 1.1rem;
            object-fit: contain;
            vertical-align: middle;
            opacity: 0.9;
        }
        .res-meta {
            font-size: 0.85rem;
            opacity: 0.7;
            margin-bottom: 12px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        .tag {
            padding: 2px 8px;
            background: rgba(99, 179, 237, 0.25);
            border-radius: 4px;
        }
        .res-desc {
            line-height: 1.8;
            color: rgba(255, 255, 255, 0.9);
            font-size: 0.95rem;
        }
        /* 分页控件 */
        .pagination {
            margin-top: 30px;
            display: flex;
            justify-content: center;
            align-items: center;
            gap: 8px;
            flex-wrap: wrap;
        }
        .page-btn {
            padding: 8px 16px;
            background: rgba(99, 179, 237, 0.2);
            border: 1px solid rgba(99, 179, 237, 0.3);
            border-radius: 6px;
            color: #fff;
            font-size: 0.9rem;
            cursor: pointer;
            transition: all 0.3s ease;
            backdrop-filter: blur(5px);
            display: flex;
            align-items: center;
            gap: 6px;
        }
        .page-btn:hover:not(:disabled) {
            background: rgba(99, 179, 237, 0.3);
            border-color: rgba(99, 179, 237, 0.5);
            transform: translateY(-1px);
        }
        .page-btn:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }
        .page-btn.active {
            background: rgba(99, 179, 237, 0.4);
            border-color: rgba(99, 179, 237, 0.6);
        }
        /* 底部版权 */
        footer {
            margin-top: 40px;
            font-size: 0.9rem;
            opacity: 0.8;
            text-align: center;
        }
        footer a {
            color: inherit;
            text-decoration: none;
        }
        footer a:hover {
            text-decoration: underline;
        }
        /* 响应式适配 */
        @media (max-width: 600px) {
            .res-card {
                padding: 25px 20px;
            }
            .res-title {
                font-size: 1.5rem;
            }
            .res-name {
                font-size: 1.1rem;
            }
            .res-desc {
                font-size: 0.9rem;
            }
            .page-btn {
                padding: 6px 12px;
                font-size: 0.85rem;
            }
            .res-meta {
                gap: 8px;
            }
        }
    </style>
    <link rel="stylesheet" href="https://cdn.bootcdn.net/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="container">
        <h1 class="res-title">
            <i class="fa-solid fa-folder-open"></i> 资源
        </h1>
        <div class="res-card">
            <!-- 资源列表容器 -->
            <div id="resList"></div>
        </div>
        <!-- 分页容器 -->
        <div class="pagination" id="pagination"></div>
    </div>
    <footer>
        Copyright © 2025 - 2026 @多多 
        <a href="https://icp.gov.moe/?keyword=20260227" target="_blank">萌ICP备20260227号</a>
    </footer>
    <script>
        // ==================== 【自定义资源区域】iconUrl 填写图片链接，留空/不写则默认下载图标 ====================
        const resourceList = [
            {
                name: "测试资源",
                date: "",
                size: "",
                type: "",
                // 不写 iconUrl 自动使用 fa-solid fa-download
                downloadUrl: "https://example.com/",
                desc: "测试资源，请勿下载"
            },
            {
                name: "Python五子棋1.0(源码+可执行程序)",
                date: "2026-07-18",
                size: "18.8MB",
                type: "游戏源码",
                iconUrl: "https://gh-proxy.com/https://github.com/duoduo61/pic/blob/main/图标.ico",
                downloadUrl: "https://pan.kslinmeng.cn/down.php/8ef92ea6d856c68a6526654009d308aa.rar",
                desc: "包含博客、后台管理、移动端页面全套HTML/CSS/JS模板，开箱即用，附带完整注释。"
            }
        ];
        // ======================================================================================
        const PAGE_SIZE = 10; // 每页显示资源数量，可自行修改
        let currentPage = 1;

        // 渲染当前页资源列表
        function renderResources() {
            const resList = document.getElementById('resList');
            const start = (currentPage - 1) * PAGE_SIZE;
            const end = start + PAGE_SIZE;
            const currentRes = resourceList.slice(start, end);
            let html = '';
            currentRes.forEach(item => {
                // 判断是否存在图片链接，有则渲染img，无则使用字体图标
                let iconHtml = '';
                if(item.iconUrl && item.iconUrl.trim() !== ''){
                    iconHtml = `<img src="${item.iconUrl}" alt="图标" class="custom-icon-img">`;
                }else{
                    iconHtml = `<i class="fa-solid fa-download"></i>`;
                }
                html += `
                    <div class="res-item">
                        <h3 class="res-name">
                            <a href="${item.downloadUrl}" target="_blank" rel="noopener noreferrer">
                                ${iconHtml} ${item.name}
                            </a>
                        </h3>
                        <div class="res-meta">
                            <span><i class="fa-solid fa-clock"></i> ${item.date}</span>
                            <span><i class="fa-solid fa-file"></i> ${item.size}</span>
                            <span class="tag"><i class="fa-solid fa-tag"></i> ${item.type}</span>
                        </div>
                        <div class="res-desc">${item.desc}</div>
                    </div>
                `;
            });
            resList.innerHTML = html;
        }

        // 渲染分页控件
        function renderPagination() {
            const pagination = document.getElementById('pagination');
            const totalPages = Math.ceil(resourceList.length / PAGE_SIZE);
            // 只有1页时隐藏分页
            if (totalPages <= 1) {
                pagination.innerHTML = '';
                return;
            }
            let html = '';
            // 上一页
            html += `
                <button class="page-btn" ${currentPage === 1 ? 'disabled' : ''} onclick="changePage(${currentPage - 1})">
                    <i class="fa-solid fa-chevron-left"></i> 上一页
                </button>
            `;
            // 页码按钮
            for (let i = 1; i <= totalPages; i++) {
                html += `
                    <button class="page-btn ${i === currentPage ? 'active' : ''}" onclick="changePage(${i})">
                        ${i}
                    </button>
                `;
            }
            // 下一页
            html += `
                <button class="page-btn" ${currentPage === totalPages ? 'disabled' : ''} onclick="changePage(${currentPage + 1})">
                    下一页 <i class="fa-solid fa-chevron-right"></i>
                </button>
            `;
            pagination.innerHTML = html;
        }

        // 切换分页
        function changePage(page) {
            const totalPages = Math.ceil(resourceList.length / PAGE_SIZE);
            if (page < 1 || page > totalPages) return;
            currentPage = page;
            renderResources();
            renderPagination();
            // 平滑滚动到页面顶部
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        // 页面加载初始化
        window.onload = function() {
            renderResources();
            renderPagination();
        }
    </script>
</body>
</html>
